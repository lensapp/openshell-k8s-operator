[workspace]
resolver = "3"
members = ["crates/operator"]

# Mirror OpenShell's workspace lints (STYLEGUIDE.md); we're a separate repo and
# cannot inherit its [workspace.lints], so replicate them here. Member crates
# opt in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
significant_drop_tightening = "allow"
missing_const_for_fn = "allow"
too_many_lines = "allow"
needless_pass_by_value = "allow"
ref_option = "allow"
missing_fields_in_debug = "allow"
