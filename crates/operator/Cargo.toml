[package]
name = "openshell-operator"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
description = "Kubernetes operator providing declarative CRDs over the OpenShell gateway"
repository = "https://github.com/lensapp/openshell-k8s-operator"

[[bin]]
name = "openshell-operator"
path = "src/main.rs"

[[bin]]
name = "crdgen"
path = "src/bin/crdgen.rs"

[lib]
name = "openshell_operator"
path = "src/lib.rs"

[dependencies]
kube = { version = "0.99.0", features = ["runtime", "derive", "client"] }
# `schemars` lets the embedded `PersistentVolumeClaimSpec` derive JsonSchema so
# it can be inlined into the OpenShellSandbox CRD (see src/crd.rs volumes).
k8s-openapi = { version = "0.24.0", features = ["latest", "schemars"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Base64 for the admission response patch payload and the injected caBundle.
base64 = "0.22"
serde_yaml = "0.9"
# `Time` for status condition timestamps (metav1.Condition.lastTransitionTime).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net"] }
# Serves the liveness/readiness probe endpoints.
axum = "0.8"
# TLS serving for the admission webhook. `no-provider` keeps us on the `ring`
# crypto provider already pulled in by the kube/rustls stack, rather than
# dragging in a second one (aws-lc-rs) via rustls' default features.
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Self-signed CA + serving cert for the webhook, generated at startup.
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
futures = "0.3"
async-trait = "0.1"
tonic = "0.14"
# `google.protobuf.Struct` builder for the sandbox template's driver_config;
# same crate/version the pinned SDK's generated protos use.
prost-types = "0.14"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# OpenShell gateway client + shared types, reused as pinned git deps.
# Pinned to an exact release tag; bump deliberately (treat the gRPC proto as an
# external contract — re-check after any bump).
openshell-sdk = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.0.90" }
openshell-core = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.0.90" }
# Canonical policy schema parser/validator; the single source of truth for
# translating policy documents into the proto `SandboxPolicy`.
openshell-policy = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.0.90" }
# Canonical provider-profile schema parser/validator; the single source of truth
# for translating profile documents into the proto `ProviderProfile`.
openshell-providers = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.0.90" }

# `ServiceExt::oneshot` drives the health router in tests without a socket.
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# Lints are defined once at the workspace root (see /Cargo.toml).
[lints]
workspace = true
