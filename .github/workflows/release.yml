name: Release

# release-please maintains a release PR from Conventional Commits. Merging it
# tags + creates a GitHub Release, which gates the publish jobs below (they run
# in this same workflow because a GITHUB_TOKEN-created tag can't trigger another
# workflow). Images build natively per arch and are merged into one manifest;
# the Helm chart is pushed to GHCR as an OCI artifact.

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/lensapp
  CHART_REPO: oci://ghcr.io/lensapp/charts

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # One native build per (image, arch); pushed by digest, no tag yet.
  build-image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [operator, issuer]
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.image }}
          platforms: linux/${{ matrix.platform.arch }}
          outputs: type=image,name=${{ env.IMAGE_NAMESPACE }}/openshell-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble the per-arch digests into a single multi-arch tag per image.
  merge-image:
    needs: [release-please, build-image]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [operator, issuer]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest list
        working-directory: /tmp/digests
        env:
          REPO: ${{ env.IMAGE_NAMESPACE }}/openshell-${{ matrix.image }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "$REPO:$VERSION" \
            -t "$REPO:latest" \
            $(printf "$REPO@sha256:%s " *)
          docker buildx imagetools inspect "$REPO:$VERSION"

  publish-chart:
    # After the images so a chart never ships pointing at image tags that
    # failed to build (which would ImagePullBackOff on install).
    needs: [release-please, merge-image]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
      - name: Package and push chart
        run: |
          # Chart.yaml version + appVersion were already bumped by release-please.
          helm dependency build deploy/charts/openshell-operator
          helm package deploy/charts/openshell-operator --destination /tmp/chart
          helm push /tmp/chart/openshell-operator-*.tgz ${{ env.CHART_REPO }}
