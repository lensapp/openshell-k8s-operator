name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - name: CRD manifest is up to date
        run: |
          cargo run --bin crdgen > deploy/charts/openshell-operator/files/crds.yaml
          git diff --exit-code -- deploy/charts/openshell-operator/files/crds.yaml

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      # Fetch the gateway subchart at the version + digest Chart.lock pins.
      - run: helm dependency build deploy/charts/openshell-operator
      - run: helm lint deploy/charts/openshell-operator
      # Render every posture: bundled default (gateway + issuer + operator), BYO
      # gateway, BYO gateway + byo token, and CRDs+RBAC-only.
      - run: helm template test deploy/charts/openshell-operator
      - run: helm template test deploy/charts/openshell-operator --set gateway.bundled=false --set gateway.endpoint=http://gw:8080
      - run: helm template test deploy/charts/openshell-operator --set gateway.bundled=false --set gateway.endpoint=http://gw:8080 --set auth.mode=byo
      - run: helm template test deploy/charts/openshell-operator --set gateway.bundled=false --set operator.deployStandalone=false
      # HA: multiple replicas render only with leader election on, and bring the
      # disruption budget and the node spread with them.
      - run: helm template test deploy/charts/openshell-operator --set replicaCount=3
      - name: HA posture renders a PDB and a spread
        run: |
          helm template test deploy/charts/openshell-operator --set replicaCount=3 \
            | grep -q 'kind: PodDisruptionBudget'
          helm template test deploy/charts/openshell-operator --set replicaCount=3 \
            | grep -q 'topologySpreadConstraints'
      # ...and a single replica brings neither, where a budget would only wedge
      # node drains.
      - name: Single replica renders no PDB
        run: "! helm template test deploy/charts/openshell-operator | grep -q 'kind: PodDisruptionBudget'"
      - run: helm template test deploy/charts/openshell-operator --set networkPolicy.enabled=true
      # Guards must fail the render: bundled + byo, bundled + no operator,
      # multiple replicas without leader election, and a budget over one replica.
      - run: "! helm template test deploy/charts/openshell-operator --set auth.mode=byo"
      - run: "! helm template test deploy/charts/openshell-operator --set operator.deployStandalone=false"
      - run: "! helm template test deploy/charts/openshell-operator --set replicaCount=3 --set leaderElection.enabled=false"
      - run: "! helm template test deploy/charts/openshell-operator --set podDisruptionBudget.enabled=true"
      - run: "! helm template test deploy/charts/openshell-operator --set replicaCount=2 --set podDisruptionBudget.minAvailable=2"
      # Percentages resolve the way the API server resolves them, rounding up.
      - run: "! helm template test deploy/charts/openshell-operator --set replicaCount=3 --set podDisruptionBudget.minAvailable=100%"
      - run: helm template test deploy/charts/openshell-operator --set replicaCount=3 --set podDisruptionBudget.minAvailable=50%
      # A quoted count is a count, not a percentage.
      - run: "! helm template test deploy/charts/openshell-operator --set replicaCount=3 --set-string podDisruptionBudget.minAvailable=3"

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [operator, issuer]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          # Shared with the e2e job, which builds the same two targets.
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  # Full-stack check: stand up agent-sandbox, then gateway + issuer + operator on
  # kind from the chart, and drive every CRD against a real gateway. This is the
  # only job that proves the reconcilers' gateway calls actually work; the rest
  # test them against a fake.
  e2e:
    runs-on: ubuntu-latest
    # Every step inside is individually bounded, but cluster creation and image
    # pulls are not — this keeps a wedged run from burning the 6h default. The
    # sandbox section pulls a multi-gigabyte sandbox image into the node, so the
    # bound is well above the job's usual runtime.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Built locally and side-loaded into kind, so the chart runs the code under
      # test rather than a published tag. Cached with the `docker` job, which
      # builds the same two targets.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: operator
          tags: openshell-operator:e2e
          load: true
          cache-from: type=gha,scope=operator
          cache-to: type=gha,mode=max,scope=operator
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: issuer
          tags: openshell-issuer:e2e
          load: true
          cache-from: type=gha,scope=issuer
          cache-to: type=gha,mode=max,scope=issuer
      - uses: helm/kind-action@v1
        with:
          cluster_name: e2e
      - name: Load images into kind
        run: kind load docker-image openshell-operator:e2e openshell-issuer:e2e --name e2e
      # Cluster-wide prerequisite, not part of the chart: the gateway's compute
      # driver provisions sandbox pods through agents.x-k8s.io. Installed with
      # the command the README gives users, so the two stay honest.
      - name: Install Agent Sandbox
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/agent-sandbox/releases/download/v0.5.2/sandbox.yaml
          kubectl -n agent-sandbox-system rollout status deploy/agent-sandbox-controller --timeout=5m
      # The batteries-included posture: one install brings up all three, with the
      # gateway subchart fetched at the version Chart.lock pins. pullPolicy=Never
      # keeps kubelet on the side-loaded images instead of reaching for a registry.
      - name: Install the chart
        run: |
          helm dependency build deploy/charts/openshell-operator
          helm install openshell deploy/charts/openshell-operator \
            --namespace openshell-system --create-namespace \
            --set image.repository=openshell-operator \
            --set image.tag=e2e \
            --set image.pullPolicy=Never \
            --set auth.issuer.repository=openshell-issuer \
            --set auth.issuer.tag=e2e \
            --set auth.issuer.pullPolicy=Never \
            --wait --timeout 10m
      # SANDBOX_E2E=1: the sandbox section skips itself where agent-sandbox is
      # absent, which here would silently drop the checks this job exists for.
      - name: Run e2e checks
        run: SANDBOX_E2E=1 NAMESPACE=openshell-system test/e2e/run.sh
      # The script dumps its own diagnostics when an assertion fails; this covers
      # the install failing before it ever runs.
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl get pods,jobs -A
          kubectl get events -n openshell-system --sort-by=.lastTimestamp | tail -40
          kubectl describe pods -n openshell-system | tail -120

  # Backstop for the commit-msg hook: reject non-Conventional-Commit subjects so
  # release-please always picks up changes. Uses the same shared validator.
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Conventional Commits
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # First push of a branch / unknown base: nothing to compare against.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "base commit unavailable; skipping"
            exit 0
          fi
          status=0
          for sha in $(git rev-list --no-merges "$base..${{ github.sha }}"); do
            subject=$(git log -1 --format=%s "$sha")
            # Merges are already dropped by --no-merges; skip the rest git generates.
            case "$subject" in "Revert "*|fixup!*|squash!*) continue ;; esac
            scripts/check-conventional-commit.sh "$subject" || status=1
          done
          exit "$status"
