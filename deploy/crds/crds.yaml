---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: openshellsandboxes.openshell.lenshq.io
spec:
  group: openshell.lenshq.io
  names:
    categories: []
    kind: OpenShellSandbox
    plural: openshellsandboxes
    shortNames:
    - oss
    singular: openshellsandbox
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.sandboxId
      name: Sandbox
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for OpenShellSandboxSpec via `CustomResource`
        properties:
          spec:
            description: |-
              Desired state for a single OpenShell sandbox.

              The sandbox's policy is applied at creation time and may be given either inline via `policy` or by reference via `policyRef` (naming an `OpenShellPolicy` in the same namespace) — at most one of the two. Gateway selection, entrypoint, and TTL/cleanup arrive in later milestones.
            properties:
              environment:
                additionalProperties:
                  type: string
                description: Environment variables injected into the sandbox runtime.
                type: object
              gpu:
                default: false
                description: Request a GPU for the sandbox.
                type: boolean
              image:
                description: Container image the sandbox runs. Empty defers to the gateway default.
                nullable: true
                type: string
              policy:
                description: Inline policy document applied at create. Mutually exclusive with `policyRef`. Use this for a one-off, self-contained sandbox; use `policyRef` to share a reusable, pre-validated policy across sandboxes.
                nullable: true
                properties:
                  filesystem:
                    description: Filesystem access policy.
                    nullable: true
                    properties:
                      includeWorkdir:
                        default: false
                        description: Mount the sandbox working directory read-write.
                        type: boolean
                      readOnly:
                        description: Absolute paths mounted read-only.
                        items:
                          type: string
                        type: array
                      readWrite:
                        description: Absolute paths mounted read-write.
                        items:
                          type: string
                        type: array
                    type: object
                  landlock:
                    description: Landlock configuration.
                    nullable: true
                    properties:
                      compatibility:
                        description: Landlock compatibility mode (e.g. `best_effort`, `enforce`).
                        type: string
                    type: object
                  networkPolicies:
                    additionalProperties:
                      x-kubernetes-preserve-unknown-fields: true
                    description: Network access rules keyed by name (e.g. `claude_code`, `gitlab`). The value schema is the gateway's `NetworkPolicyRule` and is passed through verbatim; see the OpenShell policy documentation for the field set.
                    type: object
                  process:
                    description: Process execution identity.
                    nullable: true
                    properties:
                      runAsGroup:
                        description: Group the sandbox process runs as (`sandbox` or a numeric GID).
                        type: string
                      runAsUser:
                        description: User the sandbox process runs as (`sandbox` or a numeric UID).
                        type: string
                    type: object
                  version:
                    default: 1
                    description: Policy schema version understood by the gateway. Defaults to `1`.
                    format: uint32
                    minimum: 0.0
                    type: integer
                type: object
              policyRef:
                description: Name of an `OpenShellPolicy` (same namespace) whose document is applied at create. Mutually exclusive with `policy`.
                nullable: true
                type: string
              providers:
                description: Provider names to attach. Each must already exist on the gateway.
                items:
                  type: string
                type: array
            type: object
          status:
            description: Observed state mirrored from the gateway.
            nullable: true
            properties:
              observedGeneration:
                description: '`.metadata.generation` last reconciled, for GitOps health checks.'
                format: int64
                nullable: true
                type: integer
              phase:
                description: Coarse lifecycle phase.
                enum:
                - Provisioning
                - Ready
                - Error
                - Deleting
                nullable: true
                type: string
              sandboxId:
                description: Gateway-assigned sandbox identifier, once created.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: OpenShellSandbox
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: openshellproviders.openshell.lenshq.io
spec:
  group: openshell.lenshq.io
  names:
    categories: []
    kind: OpenShellProvider
    plural: openshellproviders
    shortNames:
    - osp
    singular: openshellprovider
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for OpenShellProviderSpec via `CustomResource`
        properties:
          spec:
            description: |-
              Desired state for an OpenShell credential provider.

              Credential values are never stored on this resource — they live in a Secret referenced by [`OpenShellProviderSpec::credentials_secret_ref`] and are resolved at reconcile time.
            properties:
              config:
                additionalProperties:
                  type: string
                description: Non-secret provider configuration passed through to the gateway.
                type: object
              credentialsSecretRef:
                description: Secret (in this Provider's namespace) holding credential values.
                properties:
                  keys:
                    description: Subset of Secret keys to use as credentials. Empty uses every key.
                    items:
                      type: string
                    type: array
                  name:
                    description: Name of the Secret. Always resolved in the referencing resource's own namespace — there is no cross-namespace reference.
                    type: string
                required:
                - name
                type: object
              type:
                description: Canonical provider type slug (e.g. `claude`, `gitlab`). Immutable — enforced by the validating webhook (milestone 4).
                type: string
            required:
            - credentialsSecretRef
            - type
            type: object
          status:
            description: Observed state mirrored from the gateway for an `OpenShellProvider`.
            nullable: true
            properties:
              observedGeneration:
                description: '`.metadata.generation` last reconciled, for GitOps health checks.'
                format: int64
                nullable: true
                type: integer
              phase:
                description: Coarse lifecycle phase.
                enum:
                - Ready
                - Error
                nullable: true
                type: string
              syncedHash:
                description: Hash of the last successfully synced credentials + config. Surfaces Secret rotation and lets operators see when a resync last changed state.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: OpenShellProvider
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: openshellpolicies.openshell.lenshq.io
spec:
  group: openshell.lenshq.io
  names:
    categories: []
    kind: OpenShellPolicy
    plural: openshellpolicies
    shortNames:
    - ospol
    singular: openshellpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.valid
      name: Valid
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for OpenShellPolicySpec via `CustomResource`
        properties:
          spec:
            description: |-
              A reusable sandbox policy document.

              The high-value, stable fields (`filesystem`, `landlock`, `process`) are typed. `networkPolicies` is left opaque (preserve-unknown) because the gateway's L7 endpoint schema is large and fast-moving; validation is delegated wholesale to the gateway's own `openshell-policy` parser at reconcile time rather than mirrored (and inevitably drifting) here.

              An `OpenShellPolicy` holds no gateway state and is not synced on its own — it is a document that `OpenShellSandbox.spec.policyRef` resolves and applies at sandbox creation. Note that `filesystem`, `landlock`, and `process` are immutable on a running sandbox, so editing an `OpenShellPolicy` only affects sandboxes created afterwards.
            properties:
              filesystem:
                description: Filesystem access policy.
                nullable: true
                properties:
                  includeWorkdir:
                    default: false
                    description: Mount the sandbox working directory read-write.
                    type: boolean
                  readOnly:
                    description: Absolute paths mounted read-only.
                    items:
                      type: string
                    type: array
                  readWrite:
                    description: Absolute paths mounted read-write.
                    items:
                      type: string
                    type: array
                type: object
              landlock:
                description: Landlock configuration.
                nullable: true
                properties:
                  compatibility:
                    description: Landlock compatibility mode (e.g. `best_effort`, `enforce`).
                    type: string
                type: object
              networkPolicies:
                additionalProperties:
                  x-kubernetes-preserve-unknown-fields: true
                description: Network access rules keyed by name (e.g. `claude_code`, `gitlab`). The value schema is the gateway's `NetworkPolicyRule` and is passed through verbatim; see the OpenShell policy documentation for the field set.
                type: object
              process:
                description: Process execution identity.
                nullable: true
                properties:
                  runAsGroup:
                    description: Group the sandbox process runs as (`sandbox` or a numeric GID).
                    type: string
                  runAsUser:
                    description: User the sandbox process runs as (`sandbox` or a numeric UID).
                    type: string
                type: object
              version:
                default: 1
                description: Policy schema version understood by the gateway. Defaults to `1`.
                format: uint32
                minimum: 0.0
                type: integer
            type: object
          status:
            description: Observed validation state for an `OpenShellPolicy`.
            nullable: true
            properties:
              message:
                description: Human-readable validation error, when `valid` is `false`.
                nullable: true
                type: string
              observedGeneration:
                description: '`.metadata.generation` last reconciled, for GitOps health checks.'
                format: int64
                nullable: true
                type: integer
              valid:
                description: Whether the document parsed and validated against the gateway schema.
                nullable: true
                type: boolean
            type: object
        required:
        - spec
        title: OpenShellPolicy
        type: object
    served: true
    storage: true
    subresources:
      status: {}
