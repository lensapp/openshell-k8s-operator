{{- if .Values.operator.deployStandalone -}}
{{- $token := include "openshell-operator.tokenSecretName" . -}}
{{- $caSecret := include "openshell-operator.gatewayCaSecret" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openshell-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell-operator.labels" . | nindent 4 }}
spec:
  # More than one replica is safe only with leader election on: the standbys
  # sit idle until the lease-holder dies. The validation template enforces that
  # pairing, so replicaCount > 1 without leaderElection.enabled fails the render.
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "openshell-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openshell-operator.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "openshell-operator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
            {{- if eq (include "openshell-operator.webhookEnabled" .) "true" }}
            - name: webhook
              containerPort: {{ .Values.webhook.execConfinement.port }}
              protocol: TCP
            {{- end }}
          # Liveness: the process is up and its runtime is servicing HTTP.
          # Readiness: startup finished (gateway client built). A leader-election
          # standby reads ready too — it can take over — so a rollout can retire
          # the old leader instead of deadlocking on a never-ready new pod.
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            failureThreshold: 3
          env:
            - name: OPENSHELL_GATEWAY_ENDPOINT
              value: {{ include "openshell-operator.gatewayEndpoint" . | quote }}
            {{- if .Values.leaderElection.enabled }}
            # Leader election: pod name is the holder identity, namespace scopes
            # the Lease, and the lease name (set only here) switches election on
            # in the operator — absent, it runs the controllers directly.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPENSHELL_LEADER_ELECTION_LEASE
              value: {{ include "openshell-operator.fullname" . | quote }}
            {{- end }}
            {{- if $token }}
            - name: OPENSHELL_TOKEN_FILE
              value: /var/run/openshell/token/token
            {{- end }}
            {{- if $caSecret }}
            - name: OPENSHELL_CA_FILE
              value: /var/run/openshell/ca/ca.crt
            {{- end }}
            {{- if .Values.gateway.insecureSkipVerify }}
            - name: OPENSHELL_INSECURE_SKIP_VERIFY
              value: "true"
            {{- end }}
            {{- if eq (include "openshell-operator.webhookEnabled" .) "true" }}
            # Admission webhook: the operator serves it, self-issues the cert
            # into the Secret, and injects the caBundle into the two configs.
            - name: OPENSHELL_WEBHOOK_ENABLED
              value: "true"
            - name: OPENSHELL_WEBHOOK_LISTEN
              value: "0.0.0.0:{{ .Values.webhook.execConfinement.port }}"
            - name: OPENSHELL_WEBHOOK_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: OPENSHELL_WEBHOOK_SERVICE
              value: {{ include "openshell-operator.webhookServiceName" . | quote }}
            - name: OPENSHELL_WEBHOOK_SECRET
              value: {{ include "openshell-operator.webhookSecretName" . | quote }}
            - name: OPENSHELL_WEBHOOK_MUTATING_CONFIG
              value: {{ include "openshell-operator.webhookMutatingName" . | quote }}
            - name: OPENSHELL_WEBHOOK_VALIDATING_CONFIG
              value: {{ include "openshell-operator.webhookValidatingName" . | quote }}
            - name: OPENSHELL_WEBHOOK_WRAPPER
              value: {{ .Values.webhook.execConfinement.wrapper | toJson | quote }}
            {{- end }}
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or $token $caSecret }}
          volumeMounts:
            {{- if $token }}
            - name: gateway-token
              mountPath: /var/run/openshell/token
              readOnly: true
            {{- end }}
            {{- if $caSecret }}
            - name: gateway-ca
              mountPath: /var/run/openshell/ca
              readOnly: true
            {{- end }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or $token $caSecret }}
      volumes:
        {{- if $token }}
        - name: gateway-token
          secret:
            secretName: {{ $token }}
        {{- end }}
        {{- if $caSecret }}
        - name: gateway-ca
          secret:
            secretName: {{ $caSecret }}
        {{- end }}
      {{- end }}
{{- end }}
