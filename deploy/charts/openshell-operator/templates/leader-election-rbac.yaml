{{- if and .Values.operator.deployStandalone .Values.leaderElection.enabled -}}
# Leader election runs over a single coordination.k8s.io Lease in the release
# namespace. Namespaced Role (not the ClusterRole) so lease access is confined to
# this namespace — RBAC can't scope create/update to one resource name.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openshell-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openshell-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "openshell-operator.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "openshell-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
