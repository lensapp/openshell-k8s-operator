{{- if eq (include "openshell-operator.webhookEnabled" .) "true" -}}
# The webhook self-manages its serving cert: it creates the cert Secret in the
# operator's own namespace on first start. Namespaced (not cluster-wide) create.
# get/list/watch on secrets is already granted cluster-wide by the ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openshell-operator.webhookServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openshell-operator.webhookServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "openshell-operator.webhookServiceName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "openshell-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
