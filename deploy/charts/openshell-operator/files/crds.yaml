---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: openshellsandboxes.openshell.lenshq.io
spec:
  group: openshell.lenshq.io
  names:
    categories: []
    kind: OpenShellSandbox
    plural: openshellsandboxes
    shortNames:
    - oss
    singular: openshellsandbox
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.sandboxId
      name: Sandbox
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for OpenShellSandboxSpec via `CustomResource`
        properties:
          spec:
            description: |-
              Desired state for a single OpenShell sandbox.

              The sandbox's policy is applied at creation time and may be given either inline via `policy` or by reference via `policyRef` (naming an `OpenShellPolicy` in the same namespace) — at most one of the two. Gateway selection, entrypoint, and TTL/cleanup arrive in later milestones.
            properties:
              annotations:
                additionalProperties:
                  type: string
                description: Annotations applied to the sandbox's compute-platform resources (its pod). Immutable on a running sandbox — a change recreates it.
                type: object
              environment:
                additionalProperties:
                  type: string
                description: Environment variables injected into the sandbox runtime.
                type: object
              gpu:
                default: false
                description: Request a GPU for the sandbox.
                type: boolean
              gpuCount:
                description: Number of GPUs to request when `gpu` is set. `None` uses the driver's default (a single GPU). Ignored when `gpu` is false. Immutable on a running sandbox — a change recreates it.
                format: uint32
                minimum: 0.0
                nullable: true
                type: integer
              image:
                description: Container image the sandbox runs. Empty defers to the gateway default.
                nullable: true
                type: string
              labels:
                additionalProperties:
                  type: string
                description: Labels applied to the sandbox's compute-platform resources (its pod). Immutable on a running sandbox — a change recreates it.
                type: object
              logLevel:
                description: Sandbox-runtime log level exposed to processes inside the sandbox (e.g. `info`, `debug`). Empty defers to the gateway default. Immutable on a running sandbox — a change recreates it.
                nullable: true
                type: string
              policy:
                description: Inline policy document applied at create. Mutually exclusive with `policyRef`. Use this for a one-off, self-contained sandbox; use `policyRef` to share a reusable, pre-validated policy across sandboxes.
                nullable: true
                properties:
                  filesystem:
                    description: 'Filesystem access policy. The `readOnly`/`readWrite` lists are a Landlock allowlist: leave both empty and no filesystem rules apply; make them non-empty and every path outside the list is denied, including execute. A non-empty list must cover everything the entrypoint needs (`/usr`, `/lib`, …) or the sandbox cannot start.'
                    nullable: true
                    properties:
                      includeWorkdir:
                        default: false
                        description: Add the sandbox working directory to the read-write allowlist. This defaults to `false`, while the gateway's own default policy sets it `true` — so omitting the whole `filesystem` section is not the same as supplying an empty one.
                        type: boolean
                      readOnly:
                        description: Absolute paths allowlisted read-only.
                        items:
                          type: string
                        type: array
                      readWrite:
                        description: Absolute paths allowlisted read-write.
                        items:
                          type: string
                        type: array
                    type: object
                  landlock:
                    description: Landlock configuration.
                    nullable: true
                    properties:
                      compatibility:
                        description: Landlock compatibility mode (e.g. `best_effort`, `enforce`).
                        type: string
                    type: object
                  networkPolicies:
                    additionalProperties:
                      x-kubernetes-preserve-unknown-fields: true
                    description: Network access rules keyed by name (e.g. `claude_code`, `gitlab`). The value schema is the gateway's `NetworkPolicyRule` and is passed through verbatim; see the OpenShell policy documentation for the field set.
                    type: object
                  process:
                    description: Process execution identity.
                    nullable: true
                    properties:
                      runAsGroup:
                        description: Group the sandbox process runs as (`sandbox` or a numeric GID). Omit to let the compute runtime choose the identity.
                        type: string
                      runAsUser:
                        description: User the sandbox process runs as (`sandbox` or a numeric UID). Omit to let the compute runtime choose the identity.
                        type: string
                    type: object
                  version:
                    default: 1
                    description: Policy schema version understood by the gateway. Defaults to `1`.
                    format: uint32
                    minimum: 0.0
                    type: integer
                type: object
              policyRef:
                description: Name of an `OpenShellPolicy` (same namespace) whose document is applied at create. Mutually exclusive with `policy`.
                nullable: true
                type: string
              providers:
                description: 'Provider names to attach. Each must already exist on the gateway. Converged in place on a running sandbox: adding or removing a name attaches or detaches the provider without a recreate.'
                items:
                  type: string
                type: array
              resources:
                description: Compute resource requests and limits for the sandbox pod, as Kubernetes quantity strings (cpu e.g. `500m`/`2`, memory e.g. `256Mi`/`4Gi`). Immutable on a running sandbox — a change recreates it.
                nullable: true
                properties:
                  limits:
                    description: Maximum resources the sandbox may consume.
                    nullable: true
                    properties:
                      cpu:
                        description: CPU quantity (e.g. `500m`, `2`).
                        nullable: true
                        type: string
                      memory:
                        description: Memory quantity (e.g. `256Mi`, `4Gi`).
                        nullable: true
                        type: string
                    type: object
                  requests:
                    description: Minimum resources guaranteed to the sandbox.
                    nullable: true
                    properties:
                      cpu:
                        description: CPU quantity (e.g. `500m`, `2`).
                        nullable: true
                        type: string
                      memory:
                        description: Memory quantity (e.g. `256Mi`, `4Gi`).
                        nullable: true
                        type: string
                    type: object
                type: object
              runtimeClassName:
                description: '`RuntimeClass` requested from the compute platform (e.g. `gvisor`, `kata`). Empty uses the platform default. Immutable on a running sandbox — a change recreates it.'
                nullable: true
                type: string
              volumeRetention:
                default: Retain
                description: What happens to the provisioned `volumes` when this `OpenShellSandbox` is deleted. Volumes are always kept across gateway-side recreation; this setting only governs deletion of the resource itself.
                enum:
                - Retain
                - Delete
                type: string
              volumes:
                description: Persistent volumes provisioned and owned by this sandbox. Each entry has the operator create a PVC and mount it into the sandbox. Because the PVC is anchored to this resource — not the disposable gateway sandbox — its data survives the delete+recreate the gateway requires to change an otherwise-immutable field.
                items:
                  description: |-
                    A persistent volume the operator provisions, owns, and mounts into a sandbox.

                    The operator creates a `PersistentVolumeClaim` named deterministically from the sandbox and `name`, then wires it into the gateway's Kubernetes driver config so the sandbox pod mounts it at `mountPath`. Mounting under `/sandbox` hands OpenShell's workspace persistence to this volume (the gateway then skips its own ephemeral workspace claim); mount elsewhere (e.g. `/data`) to add durable storage alongside the image-seeded workspace.
                  properties:
                    claim:
                      description: 'The `PersistentVolumeClaim` spec used to provision the volume, embedded verbatim from the Kubernetes API — so `resources`, `storageClassName`, `accessModes`, and `dataSource` (restore from a snapshot or clone) are all available. `volumeMode: Block` is rejected: the sandbox mounts a filesystem.'
                      properties:
                        accessModes:
                          description: 'accessModes contains the desired access modes the volume should have. More info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#access-modes-1'
                          items:
                            type: string
                          type: array
                        dataSource:
                          description: 'dataSource field can be used to specify either: * An existing VolumeSnapshot object (snapshot.storage.k8s.io/VolumeSnapshot) * An existing PVC (PersistentVolumeClaim) If the provisioner or an external controller can support the specified data source, it will create a new volume based on the contents of the specified data source. When the AnyVolumeDataSource feature gate is enabled, dataSource contents will be copied to dataSourceRef, and dataSourceRef contents will be copied to dataSource when dataSourceRef.namespace is not specified. If the namespace is specified, then dataSourceRef will not be copied to dataSource.'
                          properties:
                            apiGroup:
                              description: APIGroup is the group for the resource being referenced. If APIGroup is not specified, the specified Kind must be in the core API group. For any other third-party types, APIGroup is required.
                              type: string
                            kind:
                              description: Kind is the type of resource being referenced
                              type: string
                            name:
                              description: Name is the name of resource being referenced
                              type: string
                          required:
                          - kind
                          - name
                          type: object
                        dataSourceRef:
                          description: |-
                            dataSourceRef specifies the object from which to populate the volume with data, if a non-empty volume is desired. This may be any object from a non-empty API group (non core object) or a PersistentVolumeClaim object. When this field is specified, volume binding will only succeed if the type of the specified object matches some installed volume populator or dynamic provisioner. This field will replace the functionality of the dataSource field and as such if both fields are non-empty, they must have the same value. For backwards compatibility, when namespace isn't specified in dataSourceRef, both fields (dataSource and dataSourceRef) will be set to the same value automatically if one of them is empty and the other is non-empty. When namespace is specified in dataSourceRef, dataSource isn't set to the same value and must be empty. There are three important differences between dataSource and dataSourceRef: * While dataSource only allows two specific types of objects, dataSourceRef
                              allows any non-core object, as well as PersistentVolumeClaim objects.
                            * While dataSource ignores disallowed values (dropping them), dataSourceRef
                              preserves all values, and generates an error if a disallowed value is
                              specified.
                            * While dataSource only allows local objects, dataSourceRef allows objects
                              in any namespaces.
                            (Beta) Using this field requires the AnyVolumeDataSource feature gate to be enabled. (Alpha) Using the namespace field of dataSourceRef requires the CrossNamespaceVolumeDataSource feature gate to be enabled.
                          properties:
                            apiGroup:
                              description: APIGroup is the group for the resource being referenced. If APIGroup is not specified, the specified Kind must be in the core API group. For any other third-party types, APIGroup is required.
                              type: string
                            kind:
                              description: Kind is the type of resource being referenced
                              type: string
                            name:
                              description: Name is the name of resource being referenced
                              type: string
                            namespace:
                              description: Namespace is the namespace of resource being referenced Note that when a namespace is specified, a gateway.networking.k8s.io/ReferenceGrant object is required in the referent namespace to allow that namespace's owner to accept the reference. See the ReferenceGrant documentation for details. (Alpha) This field requires the CrossNamespaceVolumeDataSource feature gate to be enabled.
                              type: string
                          required:
                          - kind
                          - name
                          type: object
                        resources:
                          description: 'resources represents the minimum resources the volume should have. If RecoverVolumeExpansionFailure feature is enabled users are allowed to specify resource requirements that are lower than previous value but must still be higher than capacity recorded in the status field of the claim. More info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#resources'
                          properties:
                            limits:
                              additionalProperties:
                                description: "Quantity is a fixed-point representation of a number. It provides convenient marshaling/unmarshaling in JSON and YAML, in addition to String() and AsInt64() accessors.\n\nThe serialization format is:\n\n``` <quantity>        ::= <signedNumber><suffix>\n\n\t(Note that <suffix> may be empty, from the \"\" case in <decimalSI>.)\n\n<digit>           ::= 0 | 1 | ... | 9 <digits>          ::= <digit> | <digit><digits> <number>          ::= <digits> | <digits>.<digits> | <digits>. | .<digits> <sign>            ::= \"+\" | \"-\" <signedNumber>    ::= <number> | <sign><number> <suffix>          ::= <binarySI> | <decimalExponent> | <decimalSI> <binarySI>        ::= Ki | Mi | Gi | Ti | Pi | Ei\n\n\t(International System of units; See: http://physics.nist.gov/cuu/Units/binary.html)\n\n<decimalSI>       ::= m | \"\" | k | M | G | T | P | E\n\n\t(Note that 1024 = 1Ki but 1000 = 1k; I didn't choose the capitalization.)\n\n<decimalExponent> ::= \"e\" <signedNumber> | \"E\" <signedNumber> ```\n\nNo matter which of the three exponent forms is used, no quantity may represent a number greater than 2^63-1 in magnitude, nor may it have more than 3 decimal places. Numbers larger or more precise will be capped or rounded up. (E.g.: 0.1m will rounded up to 1m.) This may be extended in the future if we require larger or smaller quantities.\n\nWhen a Quantity is parsed from a string, it will remember the type of suffix it had, and will use the same type again when it is serialized.\n\nBefore serializing, Quantity will be put in \"canonical form\". This means that Exponent/suffix will be adjusted up or down (with a corresponding increase or decrease in Mantissa) such that:\n\n- No precision is lost - No fractional digits will be emitted - The exponent (or suffix) is as large as possible.\n\nThe sign will be omitted unless the number is negative.\n\nExamples:\n\n- 1.5 will be serialized as \"1500m\" - 1.5Gi will be serialized as \"1536Mi\"\n\nNote that the quantity will NEVER be internally represented by a floating point number. That is the whole point of this exercise.\n\nNon-canonical values will still parse as long as they are well formed, but will be re-emitted in their canonical form. (So always use canonical form, or don't diff.)\n\nThis format is intended to make it difficult to use these numbers without writing some sort of special handling code in the hopes that that will cause implementors to also use a fixed point implementation."
                                type: string
                              description: 'Limits describes the maximum amount of compute resources allowed. More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/'
                              type: object
                            requests:
                              additionalProperties:
                                description: "Quantity is a fixed-point representation of a number. It provides convenient marshaling/unmarshaling in JSON and YAML, in addition to String() and AsInt64() accessors.\n\nThe serialization format is:\n\n``` <quantity>        ::= <signedNumber><suffix>\n\n\t(Note that <suffix> may be empty, from the \"\" case in <decimalSI>.)\n\n<digit>           ::= 0 | 1 | ... | 9 <digits>          ::= <digit> | <digit><digits> <number>          ::= <digits> | <digits>.<digits> | <digits>. | .<digits> <sign>            ::= \"+\" | \"-\" <signedNumber>    ::= <number> | <sign><number> <suffix>          ::= <binarySI> | <decimalExponent> | <decimalSI> <binarySI>        ::= Ki | Mi | Gi | Ti | Pi | Ei\n\n\t(International System of units; See: http://physics.nist.gov/cuu/Units/binary.html)\n\n<decimalSI>       ::= m | \"\" | k | M | G | T | P | E\n\n\t(Note that 1024 = 1Ki but 1000 = 1k; I didn't choose the capitalization.)\n\n<decimalExponent> ::= \"e\" <signedNumber> | \"E\" <signedNumber> ```\n\nNo matter which of the three exponent forms is used, no quantity may represent a number greater than 2^63-1 in magnitude, nor may it have more than 3 decimal places. Numbers larger or more precise will be capped or rounded up. (E.g.: 0.1m will rounded up to 1m.) This may be extended in the future if we require larger or smaller quantities.\n\nWhen a Quantity is parsed from a string, it will remember the type of suffix it had, and will use the same type again when it is serialized.\n\nBefore serializing, Quantity will be put in \"canonical form\". This means that Exponent/suffix will be adjusted up or down (with a corresponding increase or decrease in Mantissa) such that:\n\n- No precision is lost - No fractional digits will be emitted - The exponent (or suffix) is as large as possible.\n\nThe sign will be omitted unless the number is negative.\n\nExamples:\n\n- 1.5 will be serialized as \"1500m\" - 1.5Gi will be serialized as \"1536Mi\"\n\nNote that the quantity will NEVER be internally represented by a floating point number. That is the whole point of this exercise.\n\nNon-canonical values will still parse as long as they are well formed, but will be re-emitted in their canonical form. (So always use canonical form, or don't diff.)\n\nThis format is intended to make it difficult to use these numbers without writing some sort of special handling code in the hopes that that will cause implementors to also use a fixed point implementation."
                                type: string
                              description: 'Requests describes the minimum amount of compute resources required. If Requests is omitted for a container, it defaults to Limits if that is explicitly specified, otherwise to an implementation-defined value. Requests cannot exceed Limits. More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/'
                              type: object
                          type: object
                        selector:
                          description: selector is a label query over volumes to consider for binding.
                          properties:
                            matchExpressions:
                              description: matchExpressions is a list of label selector requirements. The requirements are ANDed.
                              items:
                                description: A label selector requirement is a selector that contains values, a key, and an operator that relates the key and values.
                                properties:
                                  key:
                                    description: key is the label key that the selector applies to.
                                    type: string
                                  operator:
                                    description: operator represents a key's relationship to a set of values. Valid operators are In, NotIn, Exists and DoesNotExist.
                                    type: string
                                  values:
                                    description: values is an array of string values. If the operator is In or NotIn, the values array must be non-empty. If the operator is Exists or DoesNotExist, the values array must be empty. This array is replaced during a strategic merge patch.
                                    items:
                                      type: string
                                    type: array
                                required:
                                - key
                                - operator
                                type: object
                              type: array
                            matchLabels:
                              additionalProperties:
                                type: string
                              description: matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels map is equivalent to an element of matchExpressions, whose key field is "key", the operator is "In", and the values array contains only "value". The requirements are ANDed.
                              type: object
                          type: object
                        storageClassName:
                          description: 'storageClassName is the name of the StorageClass required by the claim. More info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#class-1'
                          type: string
                        volumeAttributesClassName:
                          description: 'volumeAttributesClassName may be used to set the VolumeAttributesClass used by this claim. If specified, the CSI driver will create or update the volume with the attributes defined in the corresponding VolumeAttributesClass. This has a different purpose than storageClassName, it can be changed after the claim is created. An empty string value means that no VolumeAttributesClass will be applied to the claim but it''s not allowed to reset this field to empty string once it is set. If unspecified and the PersistentVolumeClaim is unbound, the default VolumeAttributesClass will be set by the persistentvolume controller if it exists. If the resource referred to by volumeAttributesClass does not exist, this PersistentVolumeClaim will be set to a Pending state, as reflected by the modifyVolumeStatus field, until such as a resource exists. More info: https://kubernetes.io/docs/concepts/storage/volume-attributes-classes/ (Beta) Using this field requires the VolumeAttributesClass feature gate to be enabled (off by default).'
                          type: string
                        volumeMode:
                          description: volumeMode defines what type of volume is required by the claim. Value of Filesystem is implied when not included in claim spec.
                          type: string
                        volumeName:
                          description: volumeName is the binding reference to the PersistentVolume backing this claim.
                          type: string
                      type: object
                    mountPath:
                      description: Absolute path the volume is mounted at inside the sandbox container.
                      type: string
                    name:
                      description: Volume name, also the stem of the provisioned PVC's name. Must be unique within the sandbox and a valid PVC name component (the API server rejects a malformed name at PVC creation).
                      type: string
                    readOnly:
                      default: false
                      description: Mount the volume read-only.
                      type: boolean
                    subPath:
                      description: Mount only a sub-path within the volume rather than its root.
                      nullable: true
                      type: string
                  required:
                  - claim
                  - mountPath
                  - name
                  type: object
                type: array
              workspace:
                description: 'Gateway workspace this sandbox belongs to — the name of an `OpenShellWorkspace` (cluster-scoped). Empty/omitted uses the gateway''s `default` workspace. **Immutable**: the gateway names its objects `{workspace}--{name}`, so changing the workspace would orphan the old gateway sandbox rather than move it; delete and recreate the resource to place a sandbox in a different workspace.'
                nullable: true
                type: string
            type: object
            x-kubernetes-validations:
            - message: spec.workspace is immutable
              rule: has(self.workspace) == has(oldSelf.workspace) && (!has(self.workspace) || self.workspace == oldSelf.workspace)
          status:
            description: Observed state mirrored from the gateway.
            nullable: true
            properties:
              appliedPolicyHash:
                description: Hash of the mutable policy fields (`networkPolicies` + `filesystem`) last applied. A change here is converged in place via the gateway's `UpdateConfig`, without recreating the sandbox.
                nullable: true
                type: string
              appliedSpecHash:
                description: Hash of the immutable spec fields last applied to the gateway sandbox. A change here versus the current spec is immutable drift, which the operator resolves by deleting and recreating the gateway sandbox.
                nullable: true
                type: string
              conditions:
                description: Standard conditions; the `Ready` condition reports reconcile health and, on failure, a machine-readable `reason` and human `message`.
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: '`.metadata.generation` last reconciled, for GitOps health checks.'
                format: int64
                nullable: true
                type: integer
              phase:
                description: Coarse lifecycle phase mirrored from the gateway (distinct from `Ready`, which reports the operator's own reconcile outcome).
                enum:
                - Provisioning
                - Ready
                - Error
                - Deleting
                nullable: true
                type: string
              sandboxId:
                description: Gateway-assigned sandbox identifier, once created.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: OpenShellSandbox
        type: object
    served: true
    storage: true
    subresources:
      status: {}
