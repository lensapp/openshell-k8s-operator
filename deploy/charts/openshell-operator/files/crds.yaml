apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: openshellproviders.openshell.lenshq.io
spec:
  group: openshell.lenshq.io
  names:
    categories: []
    kind: OpenShellProvider
    plural: openshellproviders
    shortNames:
    - osp
    singular: openshellprovider
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.credentialMode
      name: Mode
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for OpenShellProviderSpec via `CustomResource`
        properties:
          spec:
            description: |-
              Desired state for an OpenShell credential provider.

              Credential values are never stored on this resource — they live in a Secret referenced by [`OpenShellProviderSpec::credentials_secret_ref`] and are resolved at reconcile time.
            properties:
              config:
                additionalProperties:
                  type: string
                description: Non-secret provider configuration passed through to the gateway.
                type: object
              credentialsSecretRef:
                description: Secret (in this Provider's namespace) holding credential values.
                properties:
                  keys:
                    description: Subset of Secret keys to use as credentials. Empty uses every key.
                    items:
                      type: string
                    type: array
                  name:
                    description: Name of the Secret. Always resolved in the referencing resource's own namespace — there is no cross-namespace reference.
                    type: string
                required:
                - name
                type: object
              type:
                description: Canonical provider type slug (e.g. `claude`, `gitlab`). Immutable — enforced at admission by a CEL rule on this spec.
                type: string
              workspace:
                description: 'Gateway workspace this provider belongs to — the name of an `OpenShellWorkspace` (cluster-scoped). Empty/omitted uses the gateway''s `default` workspace. **Immutable**: a provider''s gateway identity is `(workspace, name)`, so changing the workspace would target a different object; delete and recreate the resource to move it.'
                nullable: true
                type: string
            required:
            - credentialsSecretRef
            - type
            type: object
            x-kubernetes-validations:
            - message: spec.type is immutable
              rule: self.type == oldSelf.type
            - message: spec.workspace is immutable
              rule: has(self.workspace) == has(oldSelf.workspace) && (!has(self.workspace) || self.workspace == oldSelf.workspace)
          status:
            description: Observed state mirrored from the gateway for an `OpenShellProvider`.
            nullable: true
            properties:
              conditions:
                description: Standard conditions; the `Ready` condition reports whether credentials resolved and synced to the gateway, with a `reason`/`message` on failure.
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
