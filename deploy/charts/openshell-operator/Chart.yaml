apiVersion: v2
name: openshell-operator
description: Kubernetes operator providing declarative CRDs over the OpenShell gateway
type: application
# Chart version; kept in lockstep with appVersion by release-please.
version: 0.6.0 # x-release-please-version
# Operator image version this chart defaults to.
appVersion: "0.6.0" # x-release-please-version
kubeVersion: ">=1.25.0-0"
home: https://github.com/lensapp/openshell-k8s-operator
sources:
  - https://github.com/lensapp/openshell-k8s-operator
dependencies:
  # The OpenShell gateway itself, bundled by default so a single `helm install`
  # stands up gateway + issuer + operator. Disabled with gateway.bundled=false
  # to point at an external (bring-your-own) gateway. Aliased so its values live
  # under `openshellGateway:`, separate from our own `gateway:` knobs.
  - name: helm-chart
    alias: openshellGateway
    version: "0.0.109"
    repository: oci://ghcr.io/nvidia/openshell
    condition: gateway.bundled
