# Default values for openshell-operator.

image:
  repository: ghcr.io/lensapp/openshell-operator
  # Defaults to the chart's appVersion when left empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Custom Resource Definitions. Installed and upgraded with the release. Set to
# false when CRDs are managed out of band (e.g. applied cluster-wide by an
# admin, or shared with another release).
crds:
  install: true

operator:
  # Run the operator as its own Deployment. Leave true for a standalone install.
  # Set false to install only the CRDs and RBAC — for embedding the operator
  # container in another chart. The bundled issuer is skipped in that case.
  deployStandalone: true

# Number of operator replicas. Keep at 1 unless leaderElection.enabled is true —
# without election, extra replicas would all reconcile at once. With election on,
# the surplus replicas stand by and take over only if the leader fails.
replicaCount: 1

# Leader election. When enabled, replicas contend for a coordination.k8s.io Lease
# and only the holder runs the controllers; the rest wait as warm standbys. On by
# default so scaling replicaCount up is safe out of the box — and even at a single
# replica it prevents the old and new pods from both reconciling during the
# maxSurge overlap of a rolling update, at negligible cost.
leaderElection:
  enabled: true

gateway:
  # Bundle the OpenShell gateway with this release (the batteries-included
  # default: one helm install brings up gateway + issuer + operator). Set false
  # to bring your own gateway and set `endpoint` below.
  #
  # Bundled mode pins the gateway to a fixed in-cluster identity
  # (Service `openshell-gateway`, issuer `openshell-issuer`), so run at most one
  # bundled release per namespace. The bundled gateway uses an ephemeral SQLite
  # store; provide an external database for anything but dev/demo.
  bundled: true
  # OpenShell gateway control-plane endpoint. Required only when bundled=false —
  # point it at your gateway Service, e.g.
  # https://openshell-gateway.openshell-system.svc:8080. When bundled, the
  # endpoint is derived from the bundled gateway's Service.
  endpoint: ""
  # Name of a Secret holding the gateway's server-CA bundle under key `ca.crt`,
  # for a private-CA (https) gateway. Empty uses the system roots; when bundled,
  # defaults to the gateway's self-signed server-cert Secret.
  caSecret: ""
  # Skip TLS certificate verification (development only; do not use in prod).
  insecureSkipVerify: false

# How the operator authenticates to the gateway.
auth:
  # bundledOidc — install a small static OIDC issuer (a one-shot mint Job plus a
  #   public JWKS serve pod) and authenticate the operator with the minted admin
  #   bearer. You must configure your gateway to trust this issuer; the install
  #   notes print the exact issuer/audience/role values.
  # byo — bring your own bearer: the operator mounts auth.byo.tokenSecret. Leave
  #   that empty to connect anonymously (only works against a gateway that
  #   allows unauthenticated access).
  mode: bundledOidc

  # OIDC parameters. In bundledOidc mode these drive the minted token *and* the
  # values your gateway must be configured with.
  oidc:
    # Public issuer URL the gateway discovers. Empty defaults to the in-cluster
    # Service DNS of the bundled serve pod (http is accepted by the gateway).
    issuerUrl: ""
    audience: openshell-operator
    adminRole: openshell-admin
    # Token lifetime. Long-lived by design in v1 (no refresh).
    tokenTtlDays: 3650

  # Bring-your-own settings (mode: byo).
  byo:
    # Name of a Secret with a `token` key holding the gateway bearer. Empty
    # connects without credentials.
    tokenSecret: ""

  # The bundled issuer image (mint + serve share one binary).
  issuer:
    repository: ghcr.io/lensapp/openshell-issuer
    tag: ""
    pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi

# Admission webhook that confines interactive access to sandbox pods.
#
# A sandbox's agent container runs privileged, so a plain `kubectl exec` lands
# as root, outside the per-process confinement the supervisor applies to the
# workload. When enabled, a mutating webhook rewrites exec into sandbox pods to
# re-enter the sandbox (dropping to the sandbox user under Landlock), and a
# validating webhook denies attach / `kubectl debug`, which would bypass it. The
# operator must run as its own Deployment (operator.deployStandalone=true).
webhook:
  execConfinement:
    # Whether to confine sandbox exec. Left unset (null), it follows
    # gateway.bundled: ON for the bundled batteries-included install — the
    # operator knows where sandboxes land (the gateway's sandbox namespace,
    # openshellGateway.server.sandboxNamespace, defaulting to the release
    # namespace) and scopes the webhook to exactly it, no labelling needed — and
    # OFF for a bring-your-own gateway, whose sandbox placement is outside our
    # control (opt in explicitly and label the namespaces). Set true/false to
    # override the gateway.bundled-derived default.
    enabled: null
    # Bring-your-own only: namespaces carrying `<namespaceLabel>: "enabled"` are
    # confined, which bounds the fail-closed blast radius to namespaces you opt
    # in. Ignored in bundled mode (the release namespace is scoped directly).
    namespaceLabel: openshell.lenshq.io/exec-confinement
    # failurePolicy for both webhooks. Fail (fail-closed) is the secure default:
    # if the operator is unreachable, exec/attach into confined namespaces is
    # denied rather than falling back to an unconfined root shell. Set to Ignore
    # to fail open (reopens root exec whenever the webhook is down).
    failurePolicy: Fail
    # HTTPS port the operator serves the webhook on (Service fronts it on 443).
    port: 9443
    # Argv prepended to a sandbox exec to re-enter confinement. Matches the
    # supervisor entrypoint baked into the sandbox image; override only if that
    # upstream image path changes.
    wrapper:
      - /opt/openshell/bin/openshell-sandbox
      - --mode=process
      - --

# Log filter passed to the operator via RUST_LOG (tracing EnvFilter syntax).
logLevel: info

serviceAccount:
  create: true
  # Generated from the release name when left empty.
  name: ""
  annotations: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Pod-level security context. The distroless images run as the built-in
# `nonroot` user; pin it numerically (uid 65532) so kubelet can verify non-root
# under `runAsNonRoot` — a named USER alone fails that check. Satisfies
# restricted Pod Security Standards.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Container security context. The operator writes nothing to disk (it logs to
# stdout), so the root filesystem is read-only.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Values for the bundled OpenShell gateway subchart (rendered only when
# gateway.bundled=true). Helm cannot template subchart values, so the OIDC
# settings here are fixed literals that MUST stay in sync with auth.oidc.* and
# the fixed bundled issuer identity. Only override alongside those.
openshellGateway:
  # Fixed name so the Service DNS and cert SANs are deterministic (and don't
  # collide with the operator's own release-named resources).
  fullnameOverride: openshell-gateway
  # Optional infra the batteries-included default does not require. cert-manager
  # and Gateway API stay off (the gateway self-signs via its certgen hook and is
  # reached in-cluster by Service); the sandbox NetworkPolicy is off for
  # portability across CNIs. Turn these on for a hardened install.
  networkPolicy:
    enabled: false
  server:
    # HTTPS with OIDC as the only auth: keep TLS on, drop the mTLS client CA so
    # the operator connects with just its bearer over server-TLS.
    tls:
      clientCaSecretName: ""
    # Trust the bundled issuer. issuer/audience/rolesClaim/adminRole mirror the
    # operator's auth.oidc.* — keep them identical if you override either side.
    oidc:
      issuer: http://openshell-issuer:8081
      audience: openshell-operator
      rolesClaim: roles
      adminRole: openshell-admin
      userRole: openshell-user
